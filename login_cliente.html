<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso Droguerías - Alianzas Pharma</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; width: 320px; }
        input { width: 92%; padding: 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 1rem; }
        .btn { background: #3498db; color: white; border: none; padding: 12px; border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; box-shadow: 0 4px 12px rgba(52,152,219,0.2); margin-top: 10px; }
        .btn:hover { background: #2980b9; }
        a { color: #64748b; text-decoration: none; font-size: 0.85rem; font-weight: 500; }
        
        /* 🔵 PANTALLA DE CARGA EMBELLECIDA CONTRA CONGELAMIENTOS */
        .pantalla-carga { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); z-index: 99999; align-items: center; justify-content: center; flex-direction: column; }
        .barra-progreso { width: 160px; height: 5px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-top: 20px; }
        .barra-animada { width: 100%; height: 100%; background: linear-gradient(90deg, #3498db, #9b59b6); animation: moverBarra 1.5s infinite linear; }
        @keyframes moverBarra { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
</head>
<body>

    <div class="box">
        <!-- 🎯 LOGO MÉDICO BLINDADO DESDE SERVIDOR INDESTRUCTIBLE -->
        <img src="https://flaticon.com" style="max-height: 80px; margin-bottom: 10px;">
        <h2 style="color: #2c3e50; margin: 0 0 5px 0; font-size: 1.45rem; letter-spacing: 0.5px;">ALIANZAS PHARMA</h2>
        <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 25px; font-weight: bold;">Portal de Pedidos para Droguerías Afiliadas</p>
        
        <!-- FORMULARIO DIRECTO CON ACCIÓN RELATIVA LIMPIA PARA VERCEL -->
            <form method="POST" action="/login-cliente" id="form-login-pharma">

            <input type="text" name="nit" placeholder="Escribe el NIT de la Droguería" required>
            <input type="password" name="password" placeholder="Contraseña secreta" required>
            <button type="submit" class="btn" id="btn-ingresar-submit">Iniciar Sesión</button>
        </form>
        
        <div style="display: flex; justify-content: space-between; margin-top: 25px;">
            <a href="/registro-cliente" style="color: #3498db; font-weight: 600;">Crear Cuenta</a>
            <a href="/recuperar-clave" style="color: #e67e22; font-weight: 600;">Olvidé mi clave</a>
        </div>
    </div>

    <!-- ⏳ MODAL DE CARGA CONECTADO EN CADENA -->
    <div id="pantalla-carga-pharma" class="pantalla-carga">
        <img src="https://flaticon.com" style="max-height: 70px; animation: pulse 1.8s infinite;">
        <div class="barra-progreso"><div class="barra-animada"></div></div>
        <p style="color: #2c3e50; font-weight: 600; margin-top: 15px; font-size: 0.95rem;">Verificando credenciales...</p>
    </div>

    <script>
        function activarCargaPharma(event) {
            // 1. Encendemos la animación visual en la pantalla
            document.getElementById('pantalla-carga-pharma').style.display = "flex";
            
            // 2. Apagamos el botón para evitar doble clic accidental
            let boton = document.getElementById('btn-ingresar-submit');
            boton.disabled = true;
            boton.style.background = "#94a3b8";
            boton.innerText = "Procesando...";

            // 3. 🔌 EL CABLE DE CONTROL SEGURO: Deja que el HTML nativo envíe el formulario de inmediato
            return true;
        }
    </script>
</body>
</html>
