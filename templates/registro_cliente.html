<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Registro de Droguería - Alianzas Pharma</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; width: 340px; }
        input { width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 7px; outline: none; font-size: 1rem; }
        button { background: #2ecc71; color: white; border: none; padding: 11px; border-radius: 7px; font-weight: bold; cursor: pointer; width: 96%; font-size: 1rem; box-shadow: 0 4px 10px rgba(46,204,113,0.2); }
        button:hover { background: #27ae60; }
        a { color: #3498db; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        
        /* 🔔 MODAL DE CARGA ANIDADO */
        .notif-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(244, 246, 249, 0.85); backdrop-filter: blur(4px); z-index: 99999; align-items: center; justify-content: center; flex-direction: column; }
        @keyframes progresoRegistro { 0% { left: -100%; } 50% { left: 0%; } 100% { left: 100%; } }
    </style>
</head>
<body>
    <div class="box">
        <img src="/static/logo.jpeg" style="max-height: 70px; margin-bottom: 5px;">
        <h2 style="color:#2c3e50; margin: 0 0 5px 0; font-family: sans-serif; letter-spacing: 1px;">ALIANZAS <span style="color: #8b5cf6;">PHARMA</span></h2>
        <p style="color:#64748b; font-size:0.85rem; margin-bottom:15px; font-weight: bold;">Formulario de Afiliación B2B Mayorista</p>
        
        <form method="POST" id="form-registro">
            <input type="text" name="nombre" placeholder="Nombre de la Droguería" required><br>
            <input type="text" name="nit" placeholder="NIT de la Empresa" required><br>
            <input type="text" name="direccion" placeholder="Dirección de Despacho" required><br>
            <input type="text" name="telefono" placeholder="Teléfono / WhatsApp" required><br>
           
            <input type="password" name="password" placeholder="Asigna una contraseña" required><br><br>

            <button type="submit">Registrar Mi Droguería</button>
        </form>
        <br>
        <a href="/">¿Ya tienes cuenta? Ingresa aquí</a>
    </div>

    <!-- 🟢 TARJETA DE ALTA EN LA NUBE ALIANZAS PHARMA -->
    <div id="carga-registro-pharma" class="notif-modal">
        <div style="background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); text-align: center; width: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
            <div style="width: 110px; height: 110px; background: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);">
                <img src="/public/logo.jpeg" style="max-width: 90px; max-height: 90px; object-fit: contain; border-radius: 12px;">
            </div>
            <div style="width: 85%; height: 6px; background: #e2e8f0; border-radius: 10px; overflow: hidden; position: relative;">
                <div style="position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, #2ecc71, #8b5cf6, #3498db); border-radius: 10px; animation: progresoRegistro 1.6s infinite ease-in-out;"></div>
            </div>
            <span style="font-family: sans-serif; font-size: 0.95rem; color: #475569; font-weight: 600; letter-spacing: 0.5px;">Guardando en Firebase Cloud...</span>
        </div>
    </div>

    <script>
        document.getElementById('form-registro').addEventListener('submit', function() {
            document.getElementById('carga-registro-pharma').style.display = 'flex';
        });
    </script>

            );

                "ojo_password_registro"
            );

     

    }

</script>
</body>
</html>
