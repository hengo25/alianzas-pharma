<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Recuperar contraseña - Alianzas Pharma
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contenedor {
            background: white;
            width: 100%;
            max-width: 470px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            max-height: 65px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin: 0 0 8px 0;
            font-size: 26px;
        }

        .subtitulo {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        label {
            display: block;
            color: #334155;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 17px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #3498db;
        }

        .boton {
            width: 100%;
            border: none;
            background: #3498db;
            color: white;
            padding: 13px;
            border-radius: 9px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .boton:hover {
            background: #2980b9;
        }

        .mensaje-error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 20px;
            text-align: center;
        }

        .mensaje-exito {
            background: #dcfce7;
            color: #166534;
            padding: 14px;
            border-radius: 9px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .volver {
            text-align: center;
            margin-top: 20px;
        }

        .volver a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <div class="logo">

        <img
            src="/public/logo.jpeg"
            alt="Alianzas Pharma"
        >

    </div>


    <h1>
        🔐 Recuperar contraseña
    </h1>

    <p class="subtitulo">
        Ingresa el NIT de la droguería y el teléfono
        registrado para establecer una nueva contraseña.
    </p>


    {% if error %}

        <div class="mensaje-error">
            ⚠️ {{ error }}
        </div>

    {% endif %}


    {% if exito %}

        <div class="mensaje-exito">
            ✅ {{ exito }}
        </div>

    {% endif %}


    <form
        method="POST"
        action="/recuperar-clave"
    >

        <label for="nit">
            NIT de la droguería
        </label>

        <input
            type="text"
            id="nit"
            name="nit"
            placeholder="Ej. 80230881"
            required
        >


        <label for="telefono">
            Teléfono registrado
        </label>

        <input
            type="text"
            id="telefono"
            name="telefono"
            placeholder="Número registrado en Alianzas Pharma"
            required
        >


        <label for="nueva_password">
            Nueva contraseña
        </label>

       <div style="position:relative;">

    <input
        type="password"
        id="nueva_password"
        name="nueva_password"
        placeholder="Mínimo 6 caracteres"
        minlength="6"
        required
        style="padding-right:48px;"
    >

    <button
        type="button"
        onclick="mostrarClave('nueva_password', this)"
        style="
            position:absolute;
            right:12px;
            top:12px;
            border:none;
            background:transparent;
            cursor:pointer;
            font-size:20px;
            padding:0;
        "
        title="Mostrar contraseña"
    >
        👁️
    </button>

</div>


        <label for="confirmar_password">
            Confirmar nueva contraseña
        </label>

        <div style="position:relative;">

    <input
        type="password"
        id="confirmar_password"
        name="confirmar_password"
        placeholder="Escribe nuevamente la contraseña"
        minlength="6"
        required
        style="padding-right:48px;"
    >

    <button
        type="button"
        onclick="mostrarClave('confirmar_password', this)"
        style="
            position:absolute;
            right:12px;
            top:12px;
            border:none;
            background:transparent;
            cursor:pointer;
            font-size:20px;
            padding:0;
        "
        title="Mostrar contraseña"
    >
        👁️
    </button>

</div>


        <button
            type="submit"
            class="boton"
        >
            🔑 Cambiar contraseña
        </button>

    </form>


    <div class="volver">

        <a href="/">
            ← Volver al inicio de sesión
        </a>

    </div>

</div>

<script>

    function mostrarClave(idCampo, boton) {

        const campo =
            document.getElementById(idCampo);

        if (campo.type === "password") {

            campo.type = "text";
            boton.innerText = "🙈";
            boton.title = "Ocultar contraseña";

        } else {

            campo.type = "password";
            boton.innerText = "👁️";
            boton.title = "Mostrar contraseña";

        }

    }

</script>

</body>

</html>
